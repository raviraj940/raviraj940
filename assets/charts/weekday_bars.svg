<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" width="660" height="240">
  <defs>
    <style>
      text { font-family: "Inter","Segoe UI",system-ui,sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C6FF33"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="660" height="240" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="24" y="30" fill="#e6edf3" font-size="15" font-weight="700">📅 Contributions by Weekday</text>

  <!-- Legend -->
  <circle cx="530" cy="22" r="5" fill="#00C6FF"/>
  <text x="539" y="26" fill="#8b949e" font-size="10">Weekday</text>
  <circle cx="592" cy="22" r="5" fill="#39d353"/>
  <text x="601" y="26" fill="#8b949e" font-size="10">Weekend</text>

  <!-- Gridlines  (max=24 for Tue) -->
  <line x1="55" y1="52" x2="640" y2="52" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="47" y="56" fill="#8b949e" font-size="10" text-anchor="end">24</text>
  <line x1="55" y1="90" x2="640" y2="90" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="47" y="94" fill="#8b949e" font-size="10" text-anchor="end">18</text>
  <line x1="55" y1="128" x2="640" y2="128" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="47" y="132" fill="#8b949e" font-size="10" text-anchor="end">12</text>
  <line x1="55" y1="166" x2="640" y2="166" stroke="#30363d" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="47" y="170" fill="#8b949e" font-size="10" text-anchor="end">6</text>

  <!-- Mon: 11  (11/24 = 45.8%) → bar_h = 0.458 * 150 = 68.7px -->
  <rect x="55" y="127.5" width="56" height="68.7" rx="5" fill="#00C6FF" opacity="0.90"><title>Mon: 11 contributions</title></rect>
  <text x="83" y="120" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">11</text>
  <text x="83" y="210" fill="#8b949e" font-size="12" text-anchor="middle">Mon</text>

  <!-- Tue: 24  (24/24 = 100%) → bar_h = 150px -->
  <rect x="131" y="46.2" width="56" height="150" rx="5" fill="#00C6FF" opacity="0.90"><title>Tue: 24 contributions</title></rect>
  <text x="159" y="38" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">24</text>
  <text x="159" y="210" fill="#8b949e" font-size="12" text-anchor="middle">Tue</text>

  <!-- Wed: 11 -->
  <rect x="207" y="127.5" width="56" height="68.7" rx="5" fill="#00C6FF" opacity="0.90"><title>Wed: 11 contributions</title></rect>
  <text x="235" y="120" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">11</text>
  <text x="235" y="210" fill="#8b949e" font-size="12" text-anchor="middle">Wed</text>

  <!-- Thu: 4  (4/24 = 16.7%) → bar_h = 25px -->
  <rect x="283" y="171.2" width="56" height="25" rx="5" fill="#00C6FF" opacity="0.90"><title>Thu: 4 contributions</title></rect>
  <text x="311" y="163" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text x="311" y="210" fill="#8b949e" font-size="12" text-anchor="middle">Thu</text>

  <!-- Fri: 11 -->
  <rect x="359" y="127.5" width="56" height="68.7" rx="5" fill="#00C6FF" opacity="0.90"><title>Fri: 11 contributions</title></rect>
  <text x="387" y="120" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">11</text>
  <text x="387" y="210" fill="#8b949e" font-size="12" text-anchor="middle">Fri</text>

  <!-- Sat: 14  (14/24 = 58.3%) → bar_h = 87.5px -->
  <rect x="435" y="108.7" width="56" height="87.5" rx="5" fill="#39d353" opacity="0.90"><title>Sat: 14 contributions</title></rect>
  <text x="463" y="101" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">14</text>
  <text x="463" y="210" fill="#8b949e" font-size="12" text-anchor="middle">Sat</text>

  <!-- Sun: 16  (16/24 = 66.7%) → bar_h = 100px -->
  <rect x="511" y="96.2" width="56" height="100" rx="5" fill="#39d353" opacity="0.90"><title>Sun: 16 contributions</title></rect>
  <text x="539" y="88" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">16</text>
  <text x="539" y="210" fill="#8b949e" font-size="12" text-anchor="middle">Sun</text>
</svg>
