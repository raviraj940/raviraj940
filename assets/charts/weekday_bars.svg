<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      text { font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C6FF33"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="480" height="200" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <text x="20" y="28" fill="#e6edf3" font-size="14" font-weight="700">📅 Contributions by Weekday</text>
  <rect x="40" y="80.6" width="44" height="79.4" rx="4" fill="#00C6FF"><title>Mon: 11</title></rect>
  <text x="62.0" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Mon</text>
  <text x="62.0" y="75.6" fill="#e6edf3" font-size="10" text-anchor="middle">11</text>
  <rect x="98" y="30.0" width="44" height="130.0" rx="4" fill="#00C6FF"><title>Tue: 18</title></rect>
  <text x="120.0" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Tue</text>
  <text x="120.0" y="25.0" fill="#e6edf3" font-size="10" text-anchor="middle">18</text>
  <rect x="156" y="80.6" width="44" height="79.4" rx="4" fill="#00C6FF"><title>Wed: 11</title></rect>
  <text x="178.0" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Wed</text>
  <text x="178.0" y="75.6" fill="#e6edf3" font-size="10" text-anchor="middle">11</text>
  <rect x="214" y="131.1" width="44" height="28.9" rx="4" fill="#00C6FF"><title>Thu: 4</title></rect>
  <text x="236.0" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Thu</text>
  <text x="236.0" y="126.1" fill="#e6edf3" font-size="10" text-anchor="middle">4</text>
  <rect x="272" y="80.6" width="44" height="79.4" rx="4" fill="#00C6FF"><title>Fri: 11</title></rect>
  <text x="294.0" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Fri</text>
  <text x="294.0" y="75.6" fill="#e6edf3" font-size="10" text-anchor="middle">11</text>
  <rect x="330" y="58.9" width="44" height="101.1" rx="4" fill="#39d353"><title>Sat: 14</title></rect>
  <text x="352.0" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Sat</text>
  <text x="352.0" y="53.9" fill="#e6edf3" font-size="10" text-anchor="middle">14</text>
  <rect x="388" y="44.4" width="44" height="115.6" rx="4" fill="#39d353"><title>Sun: 16</title></rect>
  <text x="410.0" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Sun</text>
  <text x="410.0" y="39.4" fill="#e6edf3" font-size="10" text-anchor="middle">16</text>
</svg>
