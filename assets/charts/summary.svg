<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      text { font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C6FF33"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="180" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <text x="20" y="30" fill="#e6edf3" font-size="14" font-weight="700">📊 GitHub Wrapped 2026 — Summary</text>

  <rect x="10" y="48" width="118" height="118" rx="10"
        fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="69" y="72" fill="#8b949e" font-size="18"
        text-anchor="middle">🔥</text>
  <text x="69" y="92" fill="#8b949e" font-size="9"
        text-anchor="middle">Total Contributions</text>
  <text x="69" y="116" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">132</text>

  <rect x="136" y="48" width="118" height="118" rx="10"
        fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="195" y="72" fill="#8b949e" font-size="18"
        text-anchor="middle">📅</text>
  <text x="195" y="92" fill="#8b949e" font-size="9"
        text-anchor="middle">Active Days</text>
  <text x="195" y="116" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">46</text>

  <rect x="262" y="48" width="118" height="118" rx="10"
        fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="321" y="72" fill="#8b949e" font-size="18"
        text-anchor="middle">⚡</text>
  <text x="321" y="92" fill="#8b949e" font-size="9"
        text-anchor="middle">Longest Streak</text>
  <text x="321" y="116" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">11 days</text>

  <rect x="388" y="48" width="118" height="118" rx="10"
        fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="447" y="72" fill="#8b949e" font-size="18"
        text-anchor="middle">💤</text>
  <text x="447" y="92" fill="#8b949e" font-size="9"
        text-anchor="middle">Longest Gap</text>
  <text x="447" y="116" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">206 days</text>

  <rect x="514" y="48" width="118" height="118" rx="10"
        fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="573" y="72" fill="#8b949e" font-size="18"
        text-anchor="middle">🎉</text>
  <text x="573" y="92" fill="#8b949e" font-size="9"
        text-anchor="middle">Weekend Activity</text>
  <text x="573" y="116" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">39</text>

  <rect x="640" y="48" width="118" height="118" rx="10"
        fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="699" y="72" fill="#8b949e" font-size="18"
        text-anchor="middle">🏆</text>
  <text x="699" y="92" fill="#8b949e" font-size="9"
        text-anchor="middle">Busiest Day</text>
  <text x="699" y="116" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">2026-11-20</text>
  <text x="699" y="134" fill="#e6edf3" font-size="10" font-weight="700" text-anchor="middle">11 contribs</text>
